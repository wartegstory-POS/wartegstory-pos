name: Build Warteg Story POS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "Index.html"
      - "www/**"
      - "icon.png"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare WWW Folder
        run: |
          mkdir -p www

          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then
              cp index.html www/index.html
            elif [ -f Index.html ]; then
              cp Index.html www/index.html
            else
              echo "ERROR: HTML POS tidak ditemukan"
              exit 1
            fi
          fi

          test -s www/index.html

      - name: Check Project Files
        run: |
          test -f www/index.html
          test -f icon.png
          test -f package.json
          test -f capacitor.config.json

      - name: Install Dependencies
        run: npm install

      - name: Prepare Capacitor Config
        run: |
          python3 - <<'PY'
          import json

          path = "capacitor.config.json"

          with open(path, encoding="utf-8") as f:
              config = json.load(f)

          config.pop("server", None)
          config["webDir"] = "www"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)

          print("Capacitor config ready")
          PY

      - name: Setup Android SDK Packages
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Generate Launcher Icons
        run: |
          pip install pillow

          python3 - <<'PY'
          from PIL import Image
          import os

          source = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(f"{folder}/ic_launcher.png")
              icon.save(f"{folder}/ic_launcher_round.png")

          folder = "android/app/src/main/res/drawable"
          os.makedirs(folder, exist_ok=True)

          foreground = source.resize(
              (432, 432),
              Image.Resampling.LANCZOS
          )
          foreground.save(
              f"{folder}/ic_launcher_foreground.png"
          )

          folder = "android/app/src/main/res/mipmap-anydpi-v26"
          os.makedirs(folder, exist_ok=True)

          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>'''

          for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              with open(f"{folder}/{name}", "w") as f:
                  f.write(xml)

          print("Launcher icons generated")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warteg-Story-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
